# vim:fileencoding=utf-8:ft=conf
# Light theme — applied automatically when macOS is in light mode
# Light counterpart of the dark theme: warm parchment background, same
# muted red / teal / mint accents darkened for readability on cream.

foreground           #4f4738
background           #f2ecdb

selection_foreground #f2ecdb
selection_background #d75f5f

cursor               #2f9e57

active_border_color   #4f4738
inactive_border_color #c9c0a6

active_tab_foreground   #f2ecdb
active_tab_background   #4f4738
inactive_tab_foreground #6f664f
inactive_tab_background #d9d0b5

# black
color0   #e4dcc6
color8   #b8ae93

# red
color1   #c04b4b
color9   #d75f5f

# green
color2   #8f8d13
color10  #2f9e57

# yellow
color3   #8f6a42
color11  #a87907

# blue
color4   #0d8f75
color12  #0d8f75

# magenta
color5   #775759
color13  #775759

# cyan
color6   #23996b
color14  #23996b

# white
color7   #4f4738
color15  #2f2f2f
